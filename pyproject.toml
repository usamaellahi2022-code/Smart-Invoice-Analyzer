[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-invoice-analyzer"
version = "0.1.0"
description = "OCR-powered invoice data extraction and validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "streamlit>=1.40,<2.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pymupdf>=1.25,<2.0",
    "pdfplumber>=0.11,<1.0",
    "pypdf>=5.0,<7.0",
    "pillow>=11.0,<13.0",
    "pytesseract>=0.3.13,<1.0",
    "opencv-python-headless>=4.10,<5.0",
    "pandas>=2.2,<4.0",
    "openpyxl>=3.1,<4.0",
    "python-dateutil>=2.9,<3.0",
    "rapidfuzz>=3.10,<4.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0"
]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
